<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Ex 14 - Drag and Drop</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; }
  .zones { display: flex; justify-content: center; gap: 120px; margin-top: 30px; }
  .zone { width: 150px; min-height: 180px; padding: 10px; border-radius: 8px; background: #f9f9f9; }
  #source { border: 1px solid #ccc; }
  #cible  { border: 2px dashed #888; }
  .zone.survol { background: #e0f2e0; }
  .element { background: #4caf50; color: white; padding: 8px; margin: 10px auto; width: 90px;
             border-radius: 4px; cursor: grab; }
</style></head>
<body>
<h3>Drag and Drop Example</h3>
<div class="zones">
  <div class="zone" id="source">
    <b>À déplacer</b>
    <div class="element" draggable="true" id="e1">Élément 1</div>
    <div class="element" draggable="true" id="e2">Élément 2</div>
    <div class="element" draggable="true" id="e3">Élément 3</div>
  </div>
  <div class="zone" id="cible"><b>Déposer ici</b></div>
</div>
<script>
// 1) on mémorise l'id de l'élément quand on commence à le glisser
var elements = document.getElementsByClassName("element");
for (var i = 0; i < elements.length; i++) {
  elements[i].addEventListener("dragstart", function (e) {
    e.dataTransfer.setData("text", e.target.id);
  });
}

// 2) les deux zones acceptent le dépôt
var zones = document.getElementsByClassName("zone");
for (var j = 0; j < zones.length; j++) {
  zones[j].addEventListener("dragover", function (e) {
    e.preventDefault();                       // obligatoire pour autoriser le drop
    this.classList.add("survol");
  });
  zones[j].addEventListener("dragleave", function () { this.classList.remove("survol"); });
  zones[j].addEventListener("drop", function (e) {
    e.preventDefault();
    this.classList.remove("survol");
    var id = e.dataTransfer.getData("text");
    this.appendChild(document.getElementById(id));
  });
}
</script>
</body></html>
